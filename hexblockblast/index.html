<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hex Blast</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" crossorigin src="./assets/index-CpqhLvis.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-iIxgMoqF.css">
</head>

<body>

    <div id="game-container">
        <div class="ui-overlay pointer-events-none p-5">
            <div class="level-container safe-area-top" onclick="game.showExperienceDetails()" style="cursor: pointer;"
                title="Show Experience Details">
                <div class="level-badge" id="level-badge">
                    <span class="level-label">LVL</span>
                    <span class="level-value" id="player-level">1</span>
                </div>
                <div class="exp-bar-container">
                    <div class="exp-bar" id="exp-progress"></div>
                </div>
            </div>

            <div class="stats-container">
                <div id="streak-display" class="streak-container hidden">
                    <span class="streak-label">STREAK</span>
                    <span class="streak-count" id="streak-count">0</span>
                </div>
                <div class="score-board">
                    <div class="score-label">Points</div>
                    <div class="score-value" id="score-display">0</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="game-over-modal">
            <h1 class="text-5xl font-black mb-2 text-white italic game-over-title">OUT OF SPACE</h1>
            <p class="text-2xl text-slate-400 mb-6 font-medium">Final Score: <span id="final-score"
                    class="text-blue-400 font-black text-4xl ml-2 drop-shadow-[0_0_10px_rgba(96,165,250,0.8)]">0</span>
            </p>

            <div id="game-over-stats" class="stats-grid mb-10 w-full max-w-sm px-4">
                <!-- Stats injected here -->
            </div>

            <button class="btn btn-glow" onclick="game.restart()">REPLAY</button>
        </div>

        <div id="combo-toast" class="toast flex flex-col items-center justify-center">
            <div class="toast-title">MEGA BLAST!</div>
            <div class="toast-score-gain text-blue-300 text-2xl mt-2"></div>
        </div>

        <div class="absolute top-5 right-5 z-50 pointer-events-auto flex flex-col gap-3 safe-area-top">
            <button
                class="bg-slate-800/50 hover:bg-slate-700/50 p-3 rounded-full backdrop-blur-sm border border-slate-700 transition-all active:scale-95"
                onclick="game.toggleMusic()" id="music-toggle-btn">
                <svg id="music-on-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="#4facfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <svg id="music-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </button>
            <button
                class="bg-slate-800/50 hover:bg-slate-700/50 p-3 rounded-full backdrop-blur-sm border border-slate-700 transition-all active:scale-95"
                onclick="game.toggleSound()" id="sound-toggle-btn">
                <svg id="sound-on-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="#4facfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="sound-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
            </button>
            <button
                class="bg-slate-800/50 hover:bg-slate-700/50 p-3 rounded-full backdrop-blur-sm border border-slate-700 transition-all active:scale-95"
                onclick="game.toggleHaptics()" id="haptic-toggle-btn">
                <svg id="haptic-on-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="#4facfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m2 8 2 2-2 2 2 2-2 2"></path>
                    <path d="m22 8-2 2 2 2-2 2 2 2"></path>
                    <rect width="8" height="14" x="8" y="5" rx="1"></rect>
                </svg>
                <svg id="haptic-off-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="m2 8 2 2-2 2 2 2-2 2"></path>
                    <path d="m22 8-2 2 2 2-2 2 2 2"></path>
                    <rect width="8" height="14" x="8" y="5" rx="1"></rect>
                    <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
            </button>
            <button
                class="bg-slate-800/50 hover:bg-slate-700/50 p-3 rounded-full backdrop-blur-sm border border-slate-700 transition-all active:scale-95"
                onclick="game.showShapes()" title="Show Shapes">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="#4facfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
                    </path>
                </svg>
            </button>
            <button
                class="bg-slate-800/50 hover:bg-slate-700/50 p-3 rounded-full backdrop-blur-sm border border-slate-700 transition-all active:scale-95"
                onclick="game.showLeaderboard()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="#4facfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z" />
                </svg>
            </button>
        </div>

        <div id="leaderboard-modal">
            <h2 class="text-3xl font-black mb-6 text-white italic">HIGH SCORES</h2>
            <div class="leaderboard-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Score</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Scores populated here -->
                    </tbody>
                </table>
            </div>
            <button class="btn btn-small mt-8" onclick="game.closeLeaderboard()">CLOSE</button>
        </div>

        <div id="shapes-modal">
            <h2 class="text-3xl font-black mb-6 text-white italic">ALL FIGURES</h2>
            <div class="shapes-container">
                <canvas id="shapesCanvas"></canvas>
            </div>
            <button class="btn btn-small mt-8" onclick="game.closeShapes()">CLOSE</button>
        </div>

        <div id="experience-modal">
            <h2 class="text-3xl font-black mb-6 text-white italic">PLAYER EXPERIENCE</h2>
            <div class="stats-grid mb-10 w-full max-w-sm px-4">
                <div class="stat-box highlight-streak">
                    <div class="stat-value glow-text-orange" id="popup-level">1</div>
                    <div class="stat-label">CURRENT LEVEL</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value glow-text-blue" id="exp-current">0</div>
                    <div class="stat-label">TOTAL EXPERIENCE</div>
                </div>
                <div class="stat-box highlight-combo">
                    <div class="stat-value glow-text-purple" id="exp-remaining">0</div>
                    <div class="stat-label">TO NEXT LEVEL</div>
                </div>
            </div>
            <button class="btn btn-small" onclick="game.closeExperienceDetails()">CLOSE</button>
        </div>
    </div>

</body>

</html>

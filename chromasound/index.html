<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaSound Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header & Controls -->
    <div class="glass-panel z-10 w-full max-w-2xl rounded-2xl p-6 mb-8 shadow-2xl transition-all hover:shadow-cyan-500/10">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                    ChromaSound
                </h1>
                <p class="text-slate-400 text-sm mt-1">Audio-to-Color Spectrum Mapper</p>
            </div>

            <div class="flex items-center gap-4">
                <select id="modeSelect" class="bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-full px-4 py-2 focus:ring-cyan-500 outline-none cursor-pointer shadow-lg">
                    <option value="supernova">Supernova Radial</option>
                    <option value="particles">Cosmic Particles</option>
                </select>

                <label class="cursor-pointer bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2 rounded-full font-medium transition-colors shadow-lg shadow-cyan-900/20">
                    <span>Upload Audio</span>
                    <input type="file" id="audioInput" accept="audio/*" class="hidden">
                </label>

                <button id="playPauseBtn" class="hidden bg-slate-700 hover:bg-slate-600 p-2 rounded-full transition-colors">
                    <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
            </div>
        </div>

        <!-- UI Feedback -->
        <div id="status" class="mt-4 text-xs text-center text-slate-500 uppercase tracking-widest">
            Ready for input
        </div>
    </div>

    <!-- Main Visualizer Canvas -->
    <div class="relative w-full flex-grow flex items-center justify-center overflow-hidden rounded-xl border border-slate-800 bg-black">
        <canvas id="visualizerCanvas" class="absolute inset-0 w-full h-full"></canvas>
        <div id="dropZone" class="absolute inset-0 flex items-center justify-center border-2 border-dashed border-slate-700 rounded-xl pointer-events-none transition-opacity duration-500 opacity-30">
            <p class="text-slate-500 italic">Drag audio file here or click Upload</p>
        </div>
    </div>

    <script>
        const audioInput = document.getElementById('audioInput');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const dropZone = document.getElementById('dropZone');

        let audioCtx;
        let analyser;
        let source;
        let animationId;
        let isPlaying = false;
        let audioBuffer;
        let startTime = 0;
        let pausedAt = 0;

        // Mode Configuration
        const modeSelect = document.getElementById('modeSelect');
        let currentMode = modeSelect.value;
        let particles = [];

        modeSelect.addEventListener('change', (e) => {
            currentMode = e.target.value;
            // Clear screens when switching
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles = [];
            feedbackCtx.fillStyle = '#000';
            feedbackCtx.fillRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
        });

        // Configuration
        const fftSize = 2048;

        // Setup feedback loop canvas
        let feedbackCanvas = document.createElement('canvas');
        let feedbackCtx = feedbackCanvas.getContext('2d');

        // Handle Resize
        function resize() {
            // Save existing image before resizing to stretch it later
            let tempCanvas;
            if (canvas.width > 0 && canvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
            }

            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            
            feedbackCanvas.width = canvas.width;
            feedbackCanvas.height = canvas.height;

            // Fill with black initially
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Restore and stretch to new dimensions
            if (tempCanvas) {
                ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
            }
        }
        window.addEventListener('resize', resize);
        resize();

        // Frequency to Color Mapping (HSL)
        function getFrequencyColor(normalizedPosition, intensity) {
            // Map the normalized position (0 to 1) to Hue (0 to 360)
            const hue = normalizedPosition * 360;
            // Use intensity for Lightness/Saturation
            const lightness = 10 + (intensity / 255) * 70;
            const saturation = 60 + (intensity / 255) * 40;
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        async function handleFile(file) {
            if (!file) return;

            status.textContent = "Loading audio...";
            dropZone.style.opacity = '0';

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            try {
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                status.textContent = "File Ready. Click Play.";
                playPauseBtn.classList.remove('hidden');
            } catch (err) {
                status.textContent = "Error loading audio file.";
                console.error(err);
            }

            if (source) source.stop();
            isPlaying = false;
            updatePlayUI();
        }

        audioInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        function playAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = fftSize;
            analyser.smoothingTimeConstant = 0.8;

            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            source.start(0, pausedAt);
            startTime = audioCtx.currentTime - pausedAt;

            source.onended = () => {
                if (isPlaying) {
                    isPlaying = false;
                    pausedAt = 0;
                    updatePlayUI();
                }
            };

            isPlaying = true;
            updatePlayUI();
            visualize();
        }

        function stopAudio() {
            if (source) {
                source.stop();
                pausedAt = audioCtx.currentTime - startTime;
            }
            isPlaying = false;
            updatePlayUI();
            cancelAnimationFrame(animationId);
        }

        function updatePlayUI() {
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopAudio();
            } else {
                playAudio();
            }
        });

        function visualize() {
            if (!isPlaying) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const activeBins = Math.floor(bufferLength * 0.7);
            const minBin = 1; 
            const logMin = Math.log10(minBin);
            const logMax = Math.log10(activeBins);
            const logRange = logMax - logMin;

            if (currentMode === 'supernova') {
                // 1. Store current frame in feedback canvas
                feedbackCtx.clearRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
                feedbackCtx.drawImage(canvas, 0, 0);

                // 2. Clear main canvas to black
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 3. Draw scaled up feedback (creates the expanding ripple effect)
                ctx.save();
                ctx.globalAlpha = 0.92; // smooth fade out
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(1.02, 1.02); // Supernova expansion speed
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
                ctx.drawImage(feedbackCanvas, 0, 0);
                ctx.restore();

                // 4. Draw new audio ring in the center
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const baseRadius = Math.min(cx, cy) * 0.2; // The inner black hole
                
                ctx.lineWidth = Math.max(2, (Math.PI * baseRadius) / activeBins * 1.5);
                ctx.lineCap = 'round';

                for (let i = minBin; i < activeBins; i++) {
                    const intensity = dataArray[i];
                    if (intensity > 5) { 
                        const normalizedLog = (Math.log10(i) - logMin) / logRange;
                        const color = getFrequencyColor(normalizedLog, intensity);
                        
                        const spikeLength = (intensity / 255) * (Math.min(cx, cy) * 0.35);

                        const angleRight = -Math.PI / 2 + (normalizedLog * Math.PI);
                        const angleLeft = -Math.PI / 2 - (normalizedLog * Math.PI);

                        ctx.strokeStyle = color;

                        ctx.beginPath();
                        ctx.moveTo(cx + Math.cos(angleRight) * baseRadius, cy + Math.sin(angleRight) * baseRadius);
                        ctx.lineTo(cx + Math.cos(angleRight) * (baseRadius + spikeLength), cy + Math.sin(angleRight) * (baseRadius + spikeLength));
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(cx + Math.cos(angleLeft) * baseRadius, cy + Math.sin(angleLeft) * baseRadius);
                        ctx.lineTo(cx + Math.cos(angleLeft) * (baseRadius + spikeLength), cy + Math.sin(angleLeft) * (baseRadius + spikeLength));
                        ctx.stroke();
                    }
                }
            } else if (currentMode === 'particles') {
                // Clear background slowly to create trails
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Switch to lighter for glowing overlap
                ctx.globalCompositeOperation = 'lighter';
                const spawnX = canvas.width - 5;

                for (let i = minBin; i < activeBins; i++) {
                    const intensity = dataArray[i];
                    if (intensity > 40) {
                        const emitProb = (intensity / 255) * 0.6;
                        if (Math.random() < emitProb) {
                            const normalizedLog = (Math.log10(i) - logMin) / logRange;
                            const y = canvas.height - (normalizedLog * canvas.height);
                            const color = getFrequencyColor(normalizedLog, intensity);

                            // Bass = big/slow, Highs = tiny/fast
                            const isBass = normalizedLog < 0.2;
                            const radius = isBass ? (Math.random() * 8 + 4) : (Math.random() * 3 + 1);
                            const baseSpeed = isBass ? 1 : 4 + normalizedLog * 6;
                            
                            particles.push({
                                x: spawnX,
                                y: y + (Math.random() - 0.5) * 15,
                                vx: -(baseSpeed + Math.random() * 3) - (intensity / 100),
                                vy: (Math.random() - 0.5) * 2,
                                color: color,
                                radius: radius,
                                life: 1.0,
                                decay: 0.005 + Math.random() * 0.015
                            });
                        }
                    }
                }

                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;

                    if (p.life <= 0 || p.x < 0) {
                        particles.splice(i, 1);
                    } else {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                    }
                }

                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
            }

            animationId = requestAnimationFrame(visualize);
        }

        // Drag and Drop
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-cyan-500');
        });
        window.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-cyan-500');
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        });
    </script>
</body>
</html>
